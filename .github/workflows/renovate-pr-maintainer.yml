---
name: Renovate PR maintainer

on:
  schedule:
  - cron: "40 * * * *"
  # Monday 06:00 UTC: weekly digest of stuck Renovate PRs to #infra-alerts.
  - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run without modifying any PR (uncheck to go live)
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  # Keeps Renovate PRs rebased (rebaseWhen: conflicted, see .github/renovate.json5) and, weekly, reports those stuck.
  maintain:
    name: Maintain Renovate PRs
    # Two runs acting on the same PRs would race.
    concurrency:
      group: renovate-pr-maintainer
      cancel-in-progress: false
    # No actions scope: the action reads and reruns PR workflow runs only with a rerun-budget of 1 or more (default 0, unset here).
    permissions:
      checks: read # read the check runs of the PRs
      contents: read # read commits and compare each PR with its base
      id-token: write # Vault OIDC/JWT auth (weekly digest)
      pull-requests: write # add the rebase label
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEEKLY_DIGEST: ${{ github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1' }}
    steps:
    - name: Maintain Renovate PRs
      id: maintainer
      uses: camunda/infra-global-github-actions/renovate-pr-maintainer@main
      with:
        dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
        github-token: ${{ github.token }}

    - name: Checkout
      if: env.WEEKLY_DIGEST == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Node.js
      if: env.WEEKLY_DIGEST == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .tool-versions

    - name: Build the stuck PRs digest
      id: digest
      if: env.WEEKLY_DIGEST == 'true'
      env:
        PROCESSED_PRS: ${{ steps.maintainer.outputs.processed-prs }}
        REPOSITORY: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        node scripts/stuck-prs.mjs --repository "${REPOSITORY}" --run-url "${RUN_URL}" --out "${RUNNER_TEMP}/stuck-prs.json" <<<"${PROCESSED_PRS}"
        if [[ -f "${RUNNER_TEMP}/stuck-prs.json" ]]; then echo "stuck=true" >>"${GITHUB_OUTPUT}"; fi

    - name: Import Secrets
      id: secrets
      if: steps.digest.outputs.stuck == 'true'
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
      with:
        url: ${{ secrets.VAULT_ADDR }}
        method: jwt
        role: ${{ secrets.VAULT_JWT_ROLE }}
        path: ${{ secrets.VAULT_JWT_PATH }}
        jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
        exportEnv: false # we rely on step outputs, no need for environment variables
        secrets: |
          secret/data/products/infra/ci/infra-core SLACK_WEBHOOK_INFRA_ALERTS;

    - name: Send the stuck PRs digest
      if: steps.digest.outputs.stuck == 'true'
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
      with:
        webhook: ${{ steps.secrets.outputs.SLACK_WEBHOOK_INFRA_ALERTS }}
        webhook-type: incoming-webhook
        errors: true # fail the step when Slack rejects the message: the action only warns by default
        payload-file-path: ${{ runner.temp }}/stuck-prs.json

    - name: Report failure
      if: failure()
      env:
        WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/renovate-pr-maintainer.yml
      run: |
        {
          echo "## Renovate PR maintainer failed"
          echo
          echo "Inspect the failed step in the job logs. A scheduled run reruns its failed jobs up to attempt 3, then alerts #infra-alerts."
          echo "A GitHub API error is usually transient: the next hourly run picks the PRs up again."
          echo "To check a fix without changing any PR, [open the workflow](${WORKFLOW_URL}) and select **Run workflow** on **main** with **dry run** checked."
        } >>"${GITHUB_STEP_SUMMARY}"

  # Retry transient failures (e.g. GitHub API errors) of scheduled runs; notify alerts after the last attempt.
  rerun-failed-jobs:
    name: Rerun failed jobs
    needs: [maintain]
    if: failure() && github.event_name == 'schedule' && fromJSON(github.run_attempt) < 3
    permissions:
      id-token: write # Vault OIDC/JWT auth
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Retrigger failed jobs
      uses: camunda/infra-global-github-actions/rerun-failed-run@main
      with:
        run-id: ${{ github.run_id }}
        repository: ${{ github.repository }}
        vault-addr: ${{ secrets.VAULT_ADDR }}
        vault-auth-method: jwt
        vault-jwt-role: ${{ secrets.VAULT_JWT_ROLE }}
        vault-jwt-path: ${{ secrets.VAULT_JWT_PATH }}
        vault-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE }}

  # A scheduled run that still fails after its last attempt, or whose retry could not be triggered.
  notify:
    name: Notify on failure
    needs: [maintain, rerun-failed-jobs]
    if: >-
      always() && github.event_name == 'schedule' && needs.maintain.result == 'failure' && (fromJSON(github.run_attempt) >= 3 || needs.rerun-failed-jobs.result == 'failure')
    permissions:
      id-token: write # Vault OIDC/JWT auth
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Import Secrets
      id: secrets
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
      with:
        url: ${{ secrets.VAULT_ADDR }}
        method: jwt
        role: ${{ secrets.VAULT_JWT_ROLE }}
        path: ${{ secrets.VAULT_JWT_PATH }}
        jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
        exportEnv: false # we rely on step outputs, no need for environment variables
        secrets: |
          secret/data/products/infra/ci/infra-core SLACK_WEBHOOK_INFRA_ALERTS;

    - name: Notify Slack
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
      with:
        webhook: ${{ steps.secrets.outputs.SLACK_WEBHOOK_INFRA_ALERTS }}
        webhook-type: incoming-webhook
        errors: true # fail the step when Slack rejects the message: the action only warns by default
        payload: |
          text: |-
            :alert: <${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>
            Renovate PR maintainer failed
            <!subteam^S01K6MZC3AQ|infra-medic> — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>

  check:
    name: Check Renovate PR maintainer
    if: always()
    permissions: {}
    needs:
    - maintain
    - rerun-failed-jobs
    - notify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Check results
      env:
        ERROR: >-
          ${{
            contains(needs.*.result, 'failure') ||
            contains(needs.*.result, 'cancelled')
          }}
      run: |
        if [ "$ERROR" == "true" ]; then
          echo "Some Renovate PR maintainer jobs have failed or been cancelled."
          exit 1
        fi
        echo "All Renovate PR maintainer jobs passed or were skipped."

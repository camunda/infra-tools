---
name: Release

# Releases (spec §5.5, D25, ADR 0013, D64), in one job whose steps each check their own end state and do nothing once it is
# reached, so a run repeated after any failure completes the release: release-please creates release X.Y.Z as a draft, without
# its tag, once GitHub auto-merged its release PR (release-merge.yml; config in .github/config/); release.mjs then pushes its
# X.Y.Z-tools index to ghcr.io, copies it to every mirror (D65), adds the Added / Replaced / Retired tables to its notes,
# attaches tools.json and publishes the draft last, which creates its tag; and release-please opens or updates the next release
# PR only once every step passed, so there is at most one draft and the PR's changelog starts at an existing tag. A failed step,
# or a failed step of the job outside them (setup), is a run failure tracked in its failure issue (ADR 0012, D63), which alerts
# #infra-alerts when it opens or reopens. Transient registry and GitHub API errors are retried inside the scripts, call by call.
# A manual run follows a fix that needs no push (a retargeted draft, a mirror back up).
on:
  push:
    branches:
    - main
  workflow_dispatch:

permissions: {}

# One run at a time, never cancelled: a run publishes the release the previous one may have created.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/camunda/infra-tools
  OUT: build/out/release

jobs:
  release:
    name: Release
    # Only main releases: a manual run on another branch would publish with its unreviewed scripts.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write # Vault OIDC/JWT auth, and the OIDC login to the mirrors' clouds
      issues: write # open, update and close the failure issues
      packages: write # push the index to ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    # First: the failure issues step needs the scripts and runbooks, whichever later step fails.
    - name: Checkout
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Import Secrets
      id: vault-secrets
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
      with:
        url: ${{ secrets.VAULT_ADDR }}
        method: jwt
        role: ${{ secrets.VAULT_JWT_ROLE }}
        path: ${{ secrets.VAULT_JWT_PATH }}
        jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
        exportEnv: false # we rely on step outputs, no need for environment variables
        secrets: |
          secret/data/products/infra/ci/infra-releases RELEASES_APP_ID;
          secret/data/products/infra/ci/infra-releases RELEASES_APP_KEY;
          secret/data/products/infra/ci/infra-core SLACK_WEBHOOK_INFRA_ALERTS;

    # The infra-releases App (D56): its release PRs, and the tag that publishing a draft creates, start the workflows a job
    # token's would not.
    - name: Generate a GitHub token
      id: app-token
      uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
      with:
        app-id: ${{ steps.vault-secrets.outputs.RELEASES_APP_ID }}
        private-key: ${{ steps.vault-secrets.outputs.RELEASES_APP_KEY }}
        permission-contents: write # release commits on the release PR branch, the draft release, its notes and tools.json, its publication
        permission-issues: write # release PR labels
        permission-pull-requests: write # the release PR
        permission-workflows: write # update and publish a draft whose target commit changes a workflow file and is no longer a branch head

    # Called directly, not through the shared release action, which exposes neither skip input (ADR 0013).
    - name: Create the draft release
      id: draft
      uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      with:
        token: ${{ steps.app-token.outputs.token }}
        config-file: .github/config/release-please-config.json
        manifest-file: .github/config/.release-please-manifest.json
        skip-github-pull-request: true

    # No dependency cache in a job that publishes: a poisoned cache would reach the release (zizmor cache-poisoning).
    - name: Set up Node.js
      id: node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .tool-versions
        package-manager-cache: false

    - name: Install dependencies
      id: dependencies
      run: npm ci --prefix scripts

    # One login step per mirror. infra-tools-mirror-sa can only write the GKE mirror (camunda/infra-core). A failed login fails
    # only that mirror's step of the release, which tracks it in its failure issue.
    - name: Authenticate to Google Cloud
      id: gar
      continue-on-error: true
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: projects/502682377344/locations/global/workloadIdentityPools/ci-gha-workload-pool/providers/gha-provider
        service_account: infra-tools-mirror-sa@ci-30-162810.iam.gserviceaccount.com
        token_format: access_token
        create_credentials_file: false # only the access token is used

    # Does nothing without a draft. Writes the failure report of each failed step, and the failure issue scopes of those that
    # passed, for the failure issues step; a step cut by the timeout leaves its report.
    - name: Publish the release
      id: release
      timeout-minutes: 30
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }} # gh, for the releases
        GITHUB_TOKEN: ${{ github.token }} # ghcr.io
        MIRROR_TOKEN_GAR: ${{ steps.gar.outputs.access_token }}
        REPOSITORY: ${{ github.repository }}
      run: |
        node scripts/release.mjs --image "${IMAGE}" --repository "${REPOSITORY}" --out "${OUT}" \
          --mirror gar=oauth2accesstoken@europe-west1-docker.pkg.dev/ci-30-162810/infra-tools/camunda/infra-tools

    # Only once every step passed: no draft is left, so the changelog starts at the latest release's tag.
    - name: Open or update the release PR
      id: release-pr
      uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      with:
        token: ${{ steps.app-token.outputs.token }}
        config-file: .github/config/release-please-config.json
        manifest-file: .github/config/.release-please-manifest.json
        skip-github-release: true

    # A failed step outside the release steps is the setup run failure (ADR 0012): its report names the failed steps, whose
    # logs are in the job log. A failure of the release step alone is reported by release.mjs.
    - name: Report a failure outside the release steps
      if: failure() && steps.checkout.outcome == 'success'
      env:
        SECRETS: ${{ steps.vault-secrets.outcome }}
        TOKEN: ${{ steps.app-token.outcome }}
        DRAFT: ${{ steps.draft.outcome }}
        NODE: ${{ steps.node.outcome }}
        DEPENDENCIES: ${{ steps.dependencies.outcome }}
        RELEASE_PR: ${{ steps.release-pr.outcome }}
      run: |
        declare -A names=([SECRETS]="Import Secrets" [TOKEN]="Generate a GitHub token" [DRAFT]="Create the draft release"
          [NODE]="Set up Node.js" [DEPENDENCIES]="Install dependencies" [RELEASE_PR]="Open or update the release PR")
        failed=()
        for var in SECRETS TOKEN DRAFT NODE DEPENDENCIES RELEASE_PR; do
          if [[ "${!var}" == failure ]]; then failed+=("${names[${var}]}"); fi
        done
        if [[ ${#failed[@]} -eq 0 ]]; then exit 0; fi
        mkdir -p "${OUT}"
        list="$(printf '%s, ' "${failed[@]}")"
        echo "Failed steps: ${list%, }. See their logs in the job log of the run." >"${OUT}/setup.log"
        node scripts/run-failure.mjs release setup --log "${OUT}/setup.log" --out "${OUT}/reports/release-setup.json"

    # Also after a failed step, whose failures it tracks; the release step writes nothing when it did not run. The setup failure
    # issue closes once a run reaches the release step without a setup failure.
    - name: Open, update and close the failure issues
      if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
      env:
        GH_TOKEN: ${{ github.token }}
        SLACK_WEBHOOK_INFRA_ALERTS: ${{ steps.vault-secrets.outputs.SLACK_WEBHOOK_INFRA_ALERTS }}
        REPOSITORY: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RELEASE: ${{ steps.release.outcome }}
      run: |
        resolve=()
        if [[ -f "${OUT}/resolve.txt" ]]; then
          while read -r scope; do resolve+=(--resolve "${scope}"); done <"${OUT}/resolve.txt"
        fi
        if [[ "${RELEASE}" != skipped && ! -f "${OUT}/reports/release-setup.json" ]]; then resolve+=(--resolve release/setup); fi
        node scripts/failure-issues.mjs --repository "${REPOSITORY}" --run-url "${RUN_URL}" --failures "${OUT}/reports" "${resolve[@]}"

---
name: Release

# Releases (spec §5.5, D25): release-please keeps a release PR up to date with the record commits and the action changes since
# the latest release (config in .github/config/), and creates release X.Y.Z as a draft, without its tag, once GitHub
# auto-merged it (release-merge.yml). The release is then published: its X.Y.Z-tools index pushed to ghcr.io, the Added /
# Replaced / Retired tables added to its notes, tools.json attached and the draft published, which creates its tag (D60): the
# action cannot be pinned to a release whose index is missing. Every draft release is published, oldest first: a release
# whose publication failed stays a draft and is completed by the next run, before any later release.
on:
  push:
    branches:
    - main

permissions: {}

# One run at a time, never cancelled: a run publishes the release the previous one may have created.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/camunda/infra-tools

jobs:
  # release-type node with a package-name, so release-please needs no package.json at the root.
  release-please:
    name: Release Please
    permissions:
      contents: read
      id-token: write # Vault OIDC/JWT auth
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Import Secrets
      id: vault-secrets
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
      with:
        url: ${{ secrets.VAULT_ADDR }}
        method: jwt
        role: ${{ secrets.VAULT_JWT_ROLE }}
        path: ${{ secrets.VAULT_JWT_PATH }}
        jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
        exportEnv: false # we rely on step outputs, no need for environment variables
        secrets: |
          secret/data/products/infra/ci/infra-releases RELEASES_APP_ID;
          secret/data/products/infra/ci/infra-releases RELEASES_APP_KEY;

    # The infra-releases App (D56): its release PRs and releases start the workflows a job token's would not.
    - name: Generate a GitHub token
      id: app-token
      uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
      with:
        app-id: ${{ steps.vault-secrets.outputs.RELEASES_APP_ID }}
        private-key: ${{ steps.vault-secrets.outputs.RELEASES_APP_KEY }}
        permission-contents: write # release commits on the release PR branch, tags and releases
        permission-issues: write # release PR labels
        permission-pull-requests: write # the release PR

    - name: Handle Release Creation
      uses: camunda/infra-global-github-actions/teams/infra/pull-request/release@main
      with:
        github-token: ${{ steps.app-token.outputs.token }}

  # Every draft release, oldest first: nothing to do on most runs.
  publish:
    name: Publish the release
    needs: release-please
    permissions:
      contents: read
      id-token: write # Vault OIDC/JWT auth
      packages: write # push the index to ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Import Secrets
      id: vault-secrets
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
      with:
        url: ${{ secrets.VAULT_ADDR }}
        method: jwt
        role: ${{ secrets.VAULT_JWT_ROLE }}
        path: ${{ secrets.VAULT_JWT_PATH }}
        jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
        exportEnv: false # we rely on step outputs, no need for environment variables
        secrets: |
          secret/data/products/infra/ci/infra-releases RELEASES_APP_ID;
          secret/data/products/infra/ci/infra-releases RELEASES_APP_KEY;

    # The infra-releases App (D56): the tag that publishing a draft creates starts the workflows a job token's would not.
    - name: Generate a GitHub token
      id: app-token
      uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
      with:
        app-id: ${{ steps.vault-secrets.outputs.RELEASES_APP_ID }}
        private-key: ${{ steps.vault-secrets.outputs.RELEASES_APP_KEY }}
        permission-contents: write # read the draft releases, add the tool tables to their notes, attach tools.json and publish them
        permission-workflows: write # update and publish a draft whose target commit changes a workflow file and is no longer a branch head

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .tool-versions
        cache: npm
        cache-dependency-path: scripts/package-lock.json

    - name: Install dependencies
      run: npm ci --prefix scripts

    # Fails when a catalog version lost its tag, or on a registry or GitHub API outage.
    - name: Publish the release
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }} # gh, for the releases
        GITHUB_TOKEN: ${{ github.token }} # the registry
        REPOSITORY: ${{ github.repository }}
      run: node scripts/index.mjs release --image "${IMAGE}" --repository "${REPOSITORY}"

    - name: Report failure
      if: failure()
      run: |
        {
          echo "## Release publication failed"
          echo
          echo "Inspect the failed step in the job logs. A failed run reruns its failed jobs up to attempt 3."
          echo "The release stays a draft, without its tag, until a run succeeds: the next push to main, or a rerun of this one, completes it before any later release."
          echo "A catalog version whose tag is missing needs its tool image published again (revision bump) or its version retired."
        } >>"${GITHUB_STEP_SUMMARY}"

  # One matrix entry per mirror filled by copy, with its login step (ADR 0007, D61).
  mirror:
    name: Copy the releases to ${{ matrix.name }}
    needs: publish
    permissions:
      contents: read
      packages: read # read the release indexes on ghcr.io
      id-token: write # OIDC login to the mirror's cloud
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: gar
          repository: europe-west1-docker.pkg.dev/ci-30-162810/infra-tools/camunda/infra-tools
          user: oauth2accesstoken
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .tool-versions
        cache: npm
        cache-dependency-path: scripts/package-lock.json

    - name: Install dependencies
      run: npm ci --prefix scripts

    # infra-tools-mirror-sa can only write the GKE mirror (camunda/infra-core).
    - name: Authenticate to Google Cloud
      id: gar
      if: matrix.name == 'gar'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: projects/502682377344/locations/global/workloadIdentityPools/ci-gha-workload-pool/providers/gha-provider
        service_account: infra-tools-mirror-sa@ci-30-162810.iam.gserviceaccount.com
        token_format: access_token
        create_credentials_file: false # only the access token is used

    - name: Copy the missing release indexes
      env:
        GITHUB_TOKEN: ${{ github.token }}
        MIRROR_TOKEN: ${{ steps.gar.outputs.access_token }}
        MIRROR: ${{ matrix.repository }}
        MIRROR_USER: ${{ matrix.user }}
      run: node scripts/index.mjs mirror --image "${IMAGE}" --mirror "${MIRROR}" --user "${MIRROR_USER}"

    - name: Report failure
      if: failure()
      env:
        MIRROR: ${{ matrix.repository }}
      run: |
        {
          echo "## Copy to ${MIRROR} failed"
          echo
          echo "Inspect the failed step in the job logs. The releases are published on ghcr.io: runners using this mirror fall back to it."
          echo "The next run copies them: the next push to main, or a rerun of this one."
        } >>"${GITHUB_STEP_SUMMARY}"

  # Retry transient failures (e.g. GitHub API or registry errors); the run fails after the last attempt.
  rerun-failed-jobs:
    name: Rerun failed jobs
    needs: [release-please, publish, mirror]
    if: failure() && fromJSON(github.run_attempt) < 3
    permissions:
      id-token: write # Vault OIDC/JWT auth
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Retrigger failed jobs
      uses: camunda/infra-global-github-actions/rerun-failed-run@main
      with:
        run-id: ${{ github.run_id }}
        repository: ${{ github.repository }}
        vault-addr: ${{ secrets.VAULT_ADDR }}
        vault-auth-method: jwt
        vault-jwt-role: ${{ secrets.VAULT_JWT_ROLE }}
        vault-jwt-path: ${{ secrets.VAULT_JWT_PATH }}
        vault-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE }}

  check:
    name: Check Release
    if: always()
    permissions: {}
    needs:
    - release-please
    - publish
    - mirror
    - rerun-failed-jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Check results
      env:
        ERROR: >-
          ${{
            contains(needs.*.result, 'failure') ||
            contains(needs.*.result, 'cancelled')
          }}
      run: |
        if [ "$ERROR" == "true" ]; then
          echo "Some release jobs have failed or been cancelled."
          exit 1
        fi
        echo "All release jobs passed or were skipped."

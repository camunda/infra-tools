---
name: Release merge

# Daily release (spec §5.5, D25, D56): enables GitHub auto-merge on the open release PR of release-please as the Infra -
# Releases App, no bypass actor of the main ruleset: GitHub merges it once its required checks pass (the "Allow auto-merge"
# repository setting must be on), and release.yml then creates and publishes the release.
on:
  schedule:
  - cron: '0 5 * * *' # every day at 05:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  merge:
    name: Enable auto-merge on the release PR
    permissions:
      id-token: write # Vault OIDC/JWT auth
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Import Secrets
      id: vault-secrets
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
      with:
        url: ${{ secrets.VAULT_ADDR }}
        method: jwt
        role: ${{ secrets.VAULT_JWT_ROLE }}
        path: ${{ secrets.VAULT_JWT_PATH }}
        jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
        exportEnv: false # we rely on step outputs, no need for environment variables
        secrets: |
          secret/data/products/infra/ci/infra-releases RELEASES_APP_ID;
          secret/data/products/infra/ci/infra-releases RELEASES_APP_KEY;

    # The infra-releases App (D56), no bypass actor: the merge waits on the ruleset's required checks.
    - name: Generate a GitHub token
      id: app-token
      uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
      with:
        app-id: ${{ steps.vault-secrets.outputs.RELEASES_APP_ID }}
        private-key: ${{ steps.vault-secrets.outputs.RELEASES_APP_KEY }}
        permission-contents: write # the squash merge GitHub makes on auto-merge
        permission-pull-requests: write # enable auto-merge on the release PR

    # A release PR labelled no-merge is left alone.
    - name: Enable auto-merge on the release PR
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        PR=$(gh pr list --label "autorelease: pending" --json number,labels --jq '
          [.[] | select(.labels | map(.name) | index("no-merge") | not)] | first | .number')

        if [ -z "$PR" ] || [ "$PR" = "null" ]; then
          echo "No release PR found."
          exit 0
        fi

        echo "Enabling auto-merge on release PR #${PR}"
        gh pr merge "$PR" --auto --squash

    - name: Report failure
      if: failure()
      run: |
        {
          echo "## Release merge failed"
          echo
          echo "Inspect the failed step in the job logs. A transient GitHub error reruns the failed jobs up to attempt 3."
          echo "The next daily run enables auto-merge on the release PR again."
        } >>"${GITHUB_STEP_SUMMARY}"

  # Retry transient failures (e.g. GitHub 504s); the run fails on any other failure or after the last attempt.
  rerun-failed-jobs:
    name: Rerun failed jobs
    needs: [merge]
    if: failure() && fromJSON(github.run_attempt) < 3
    permissions:
      id-token: write # Vault OIDC/JWT auth
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Retrigger failed jobs
      uses: camunda/infra-global-github-actions/rerun-failed-run@main
      with:
        error-messages: |
          code: 504
          non-200 OK status
        run-id: ${{ github.run_id }}
        repository: ${{ github.repository }}
        vault-addr: ${{ secrets.VAULT_ADDR }}
        vault-auth-method: jwt
        vault-jwt-role: ${{ secrets.VAULT_JWT_ROLE }}
        vault-jwt-path: ${{ secrets.VAULT_JWT_PATH }}
        vault-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE }}

  check:
    name: Check Release merge
    if: always()
    permissions: {}
    needs:
    - merge
    - rerun-failed-jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Check results
      env:
        ERROR: >-
          ${{
            contains(needs.*.result, 'failure') ||
            contains(needs.*.result, 'cancelled')
          }}
      run: |
        if [ "$ERROR" == "true" ]; then
          echo "Some release merge jobs have failed or been cancelled."
          exit 1
        fi
        echo "All release merge jobs passed or were skipped."

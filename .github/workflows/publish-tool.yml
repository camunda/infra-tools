---
name: Publish tool

# Manual until the reconciler publishes tool versions: builds, tests and pushes the tool image of one tool version, then
# adds it to an index.
on:
  workflow_dispatch:
    inputs:
      tool:
        description: Tool, a folder of tools/ (e.g. maven).
        required: true
      version:
        description: Version published by the tool definition (e.g. 3.9.16).
        required: true
      index-tag:
        description: Tag of the index in ghcr.io/camunda/infra-tools the tool version is added to.
        default: tracer-tools

permissions: {}

# Shared with reconcile.yml, which pushes tool images too: a tag is checked, then written, so two runs must not push the same
# one.
concurrency:
  group: publish-tool-images
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.tool }} ${{ inputs.version }}
    permissions:
      contents: read
      packages: write # push the tool image and the index to ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOOL: ${{ inputs.tool }}
      VERSION: ${{ inputs.version }}
      IMAGE: ghcr.io/camunda/infra-tools
      INDEX_TAG: ${{ inputs.index-tag }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .tool-versions
        cache: npm
        cache-dependency-path: scripts/package-lock.json

    - name: Install dependencies
      run: npm ci --prefix scripts

    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build, test and push the tool image
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: node scripts/build.mjs "${TOOL}" "${VERSION}" --push "${IMAGE}"

    - name: Add the tool image to the index
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: node scripts/index.mjs tracer --index "${IMAGE}:${INDEX_TAG}" "${TOOL}@${VERSION}"

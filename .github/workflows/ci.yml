---
name: CI

on:
  push:
    branches:
    - main
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Test index, filled by the Publish tool workflow until the first release.
  INDEX: ghcr.io/camunda/infra-tools:tracer-tools

jobs:
  test:
    name: Test scripts
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .tool-versions
        cache: npm
        cache-dependency-path: scripts/package-lock.json

    - name: Run tests
      run: make test

  # Pull request checks (spec §5.4): plan the tools the PR changes, warn about revisions, comment the release notes preview.
  # Read only: nothing is pushed or published.
  pr-plan:
    name: Plan pull request
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read # read published tags and the latest release's index
      pull-requests: write # comment the release notes preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      builds: ${{ steps.check.outputs.builds }}
    env:
      OUT: build/out/pull-request
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        # The merge commit and its first parent, the base: the changed files and the base tool definitions.
        fetch-depth: 2

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .tool-versions
        cache: npm
        cache-dependency-path: scripts/package-lock.json

    - name: Install dependencies
      run: make install

    - name: Check the pull request
      id: check
      env:
        GITHUB_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
      run: |
        node scripts/pull-request.mjs --image ghcr.io/camunda/infra-tools --repository "${REPOSITORY}" --out "${OUT}"
        echo "builds=$(jq -c . "${OUT}/builds.json")" >> "$GITHUB_OUTPUT"
        if [[ -f "${OUT}/comment.md" ]]; then
          cat "${OUT}/comment.md" >> "$GITHUB_STEP_SUMMARY"
          echo "comment=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Comment the release notes preview
      # Fork PRs get a read-only token: the preview stays in the job summary.
      if: steps.check.outputs.comment == 'true' && github.event.pull_request.head.repo.full_name == github.repository
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        REPOSITORY: ${{ github.repository }}
      run: |
        marker="$(head -n 1 "${OUT}/comment.md")"
        id="$(gh api --paginate "repos/${REPOSITORY}/issues/${PR}/comments" \
          | jq -rs --arg marker "${marker}" '[.[][] | select(.user.login == "github-actions[bot]" and (.body | startswith($marker)))][0].id // empty')"
        if [[ -n "${id}" ]]; then
          gh api --silent -X PATCH "repos/${REPOSITORY}/issues/comments/${id}" -F "body=@${OUT}/comment.md"
        else
          gh api --silent "repos/${REPOSITORY}/issues/${PR}/comments" -F "body=@${OUT}/comment.md"
        fi

  pr-dry-run:
    name: Dry run ${{ matrix.tool }} ${{ matrix.version }}
    needs: pr-plan
    if: needs.pr-plan.outputs.builds != '' && needs.pr-plan.outputs.builds != '[]'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pr-plan.outputs.builds) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .tool-versions
        cache: npm
        cache-dependency-path: scripts/package-lock.json

    - name: Install dependencies
      run: make install

    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # linux/amd64 and linux/arm64, with the tool test on each; no --push.
    - name: Build and test the tool image
      env:
        TOOL: ${{ matrix.tool }}
        VERSION: ${{ matrix.version }}
      run: node scripts/build.mjs "${TOOL}" "${VERSION}"

  action-linux:
    name: Test action (${{ matrix.runner }})
    permissions:
      contents: read
      packages: read # pull the index and the tool images
    strategy:
      fail-fast: false
      matrix:
        # Every Ubuntu release our runners use (D58), on x64 and arm64.
        runner: [ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install maven
      id: install
      uses: ./
      with:
        tools: maven@3
        index: ${{ env.INDEX }}
        summary: true

    - name: Check maven is installed and on PATH
      env:
        VERSIONS: ${{ steps.install.outputs.versions }}
      run: |
        version="$(jq -er .maven <<<"${VERSIONS}")"
        [[ "$(jq -c 'keys' <<<"${VERSIONS}")" == '["maven"]' ]]
        arch="$(tr '[:upper:]' '[:lower:]' <<<"${RUNNER_ARCH}")"
        test -f "${RUNNER_TOOL_CACHE}/maven/${version}/${arch}.complete"
        [[ "$(command -v mvn)" == "${RUNNER_TOOL_CACHE}/maven/${version}/${arch}/bin/mvn" ]]
        mvn --version | grep -F "Apache Maven ${version} "

    - name: Install maven again, with an unreachable index
      id: present
      uses: ./
      with:
        tools: maven@3
        index: 127.0.0.1:1/camunda/infra-tools:none

    - name: Install an unknown version
      id: unknown
      continue-on-error: true
      uses: ./
      with:
        tools: maven@99
        index: ${{ env.INDEX }}

    - name: Check a present tool needs no network and an unknown version fails
      env:
        INSTALLED: ${{ steps.install.outputs.versions }}
        PRESENT: ${{ steps.present.outputs.versions }}
        UNKNOWN: ${{ steps.unknown.outcome }}
      run: |
        [[ "${PRESENT}" == "${INSTALLED}" ]]
        [[ "${UNKNOWN}" == failure ]]

  action-validate:
    name: Test action (validate mode)
    permissions:
      contents: read
      packages: read # pull the index
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    # The workspace stands for a consumer repository: the action is checked out beside its workflows.
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        path: infra-tools

    - name: Add a workflow with valid selectors
      run: |
        mkdir -p .github/workflows
        cp infra-tools/scripts/test/fixtures/valid-selectors.yml .github/workflows/
        ls -A "${RUNNER_TOOL_CACHE}" >"${RUNNER_TEMP}/tool-cache-before"
        echo "PATH_BEFORE=${PATH}" >>"${GITHUB_ENV}"

    - name: Validate valid selectors
      id: valid
      uses: ./infra-tools
      with:
        mode: validate
        index: ${{ env.INDEX }}

    - name: Check validate installs nothing and leaves PATH unchanged
      env:
        VERSIONS: ${{ steps.valid.outputs.versions }}
      run: |
        [[ "${VERSIONS}" == "{}" ]]
        [[ "${PATH}" == "${PATH_BEFORE}" ]]
        diff "${RUNNER_TEMP}/tool-cache-before" <(ls -A "${RUNNER_TOOL_CACHE}")

    - name: Add a workflow with invalid selectors
      run: cp infra-tools/scripts/test/fixtures/invalid-selectors.yml .github/workflows/

    - name: Validate invalid selectors
      id: invalid
      continue-on-error: true
      uses: ./infra-tools
      with:
        mode: validate
        index: ${{ env.INDEX }}

    - name: Check invalid selectors fail
      env:
        OUTCOME: ${{ steps.invalid.outcome }}
      run: '[[ "${OUTCOME}" == failure ]]'

  action-macos:
    name: Test action (macos-latest)
    permissions:
      contents: read
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install maven
      id: install
      uses: ./
      with:
        tools: maven@3
        index: ${{ env.INDEX }}

    - name: Check nothing is installed
      env:
        VERSIONS: ${{ steps.install.outputs.versions }}
      run: '[[ "${VERSIONS}" == "{}" ]]'

  check:
    name: Check CI
    if: always()
    permissions: {}
    needs:
    - test
    - pr-plan
    - pr-dry-run
    - action-linux
    - action-validate
    - action-macos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Check results
      env:
        ERROR: >-
          ${{
            contains(needs.*.result, 'failure') ||
            contains(needs.*.result, 'cancelled')
          }}
      run: |
        if [ "$ERROR" == "true" ]; then
          echo "Some CI jobs have failed or been cancelled."
          exit 1
        fi
        echo "All CI jobs passed or were skipped."

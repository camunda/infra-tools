---
name: Reconcile

# Reconciler (spec §5.3, ADR 0005): publishes every upstream version within the version lines of the tool definitions. Builds,
# tests and pushes the missing tool images with the job token, creates their tool releases, and records them in one commit per
# run, pushed to main by the Infra - Misc App, bypass actor of the main ruleset (D49). Failures are tracked in failure issues
# (ADR 0012, D63): a version that fails to build or test is a tool failure, in the issue of its tool and major, which alerts
# #infra-alerts when it opens or reopens, and leaves the run green; any other failed step (plan, push, record, the completeness
# check R17) is a run failure, in the issue of its step, which alerts #infra-alerts once the step has kept failing for a day
# (D67), and fails the run, with guidance in its job summaries. Transient registry and GitHub API errors are retried inside the
# scripts, call by call: a step fails only when its error persists.
on:
  schedule:
  - cron: '0 */2 * * *' # every 2 hours
  push:
    branches:
    - main
    # Record commits only change the catalog: they publish nothing new.
    paths-ignore:
    - published/**
  workflow_dispatch:

permissions: {}

# One run at a time, never cancelled: a run plans against what the previous one published, and a tag is checked, then
# written, so two runs must not push the same one.
concurrency:
  group: publish-tool-images
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/camunda/infra-tools
  OUT: build/out/reconcile

jobs:
  plan:
    name: Plan
    # Only main publishes: a manual run on another branch would push its unreviewed tool definitions and record them into main.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read # read the published tags
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # A superseded run plans no builds.
      builds: ${{ steps.plan.outputs.builds || '[]' }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # A rerun of an older run keeps its commit, so its tool definitions: it must not publish versions main dropped (spec §5.3).
    - name: Check the run is not superseded
      id: guard
      run: scripts/superseded.sh

    - name: Set up Node.js
      if: steps.guard.outputs.superseded == 'false'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .tool-versions
        cache: npm
        cache-dependency-path: scripts/package-lock.json

    - name: Install dependencies
      if: steps.guard.outputs.superseded == 'false'
      run: npm ci --prefix scripts

    # Fails on an upstream or registry outage, and when a catalog version lost its tag. Versions that failed in earlier runs are
    # built again. The log is kept for the run failure report.
    - name: Plan the tool versions to publish
      id: plan
      if: steps.guard.outputs.superseded == 'false'
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -o pipefail
        mkdir -p "${OUT}"
        node scripts/plan.mjs --image "${IMAGE}" --out "${OUT}" 2>&1 | tee "${OUT}/plan.log"
        echo "builds=$(jq -c . "${OUT}/builds.json")" >>"${GITHUB_OUTPUT}"

    - name: Report the run failure
      if: failure() && steps.guard.outputs.superseded == 'false'
      run: node scripts/run-failure.mjs reconcile plan --log "${OUT}/plan.log" --out "${OUT}/reports/reconcile-plan.json"

    - name: Upload the run failure
      if: failure() && steps.guard.outputs.superseded == 'false'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: report-plan
        path: ${{ env.OUT }}/reports/reconcile-plan.json
        if-no-files-found: error
        overwrite: true # a manual rerun of the job replaces it
        retention-days: 7

  build:
    name: Publish ${{ matrix.tool }} ${{ matrix.version }}
    needs: plan
    if: needs.plan.outputs.builds != '[]'
    permissions:
      contents: read
      packages: write # push the tool image to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    # Multi-platform build and tests, the other platform under QEMU: a long-running runner (spec §5.8).
    runs-on: gcp-core-4-longrunning
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Again in each build: main may have moved since the plan, and a manual rerun of failed jobs skips the plan.
    - name: Check the run is not superseded
      id: guard
      run: scripts/superseded.sh

    - name: Set up Node.js
      if: steps.guard.outputs.superseded == 'false'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .tool-versions
        cache: npm
        cache-dependency-path: scripts/package-lock.json

    - name: Install dependencies
      if: steps.guard.outputs.superseded == 'false'
      run: npm ci --prefix scripts

    - name: Set up QEMU
      if: steps.guard.outputs.superseded == 'false'
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Set up Docker Buildx
      if: steps.guard.outputs.superseded == 'false'
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # Never over an existing tag: published tool images never change. A failed build or test, a tool failure, leaves the job
    # green: it goes to the Failure issues job, which tracks it in the failure issue of its tool and major, and to the job
    # summary. A failed push fails the job: a run failure. The log is kept for the run failure report.
    - name: Build, test and push the tool image
      id: build
      if: steps.guard.outputs.superseded == 'false'
      env:
        GITHUB_TOKEN: ${{ github.token }}
        TOOL: ${{ matrix.tool }}
        VERSION: ${{ matrix.version }}
        REVISION: ${{ matrix.revision }}
        TAG: ${{ matrix.tag }}
        PLATFORMS: ${{ matrix.platforms }}
        REUSE: ${{ matrix.reuse }}
      run: |
        set -o pipefail
        mkdir -p "${OUT}"
        node scripts/build.mjs "${TOOL}" "${VERSION}" --revision "${REVISION}" --platforms "${PLATFORMS}" ${REUSE:+--reuse "${REUSE}"} \
          --push "${IMAGE}" --failure "${OUT}/failures/${TAG}.json" 2>&1 | tee "${OUT}/push.log"
        if [[ -f "${OUT}/failures/${TAG}.json" ]]; then echo "failed=true" >>"${GITHUB_OUTPUT}"; fi

    - name: Upload the build failure
      if: steps.build.outputs.failed == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: failure-${{ matrix.tag }}
        path: ${{ env.OUT }}/failures/${{ matrix.tag }}.json
        if-no-files-found: error
        overwrite: true # a manual rerun of the job replaces it
        retention-days: 7

    - name: Report the run failure
      if: failure() && steps.guard.outputs.superseded == 'false'
      env:
        TAG: ${{ matrix.tag }}
      run: node scripts/run-failure.mjs reconcile push --subject "${TAG}" --log "${OUT}/push.log" --out "${OUT}/reports/reconcile-push-${TAG}.json"

    - name: Upload the run failure
      if: failure() && steps.guard.outputs.superseded == 'false'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: report-push-${{ matrix.tag }}
        path: ${{ env.OUT }}/reports/reconcile-push-${{ matrix.tag }}.json
        if-no-files-found: error
        overwrite: true # a manual rerun of the job replaces it
        retention-days: 7

  record:
    name: Record
    needs:
    - plan
    - build
    # Also after failed builds: what was pushed is recorded, the rest is planned again by the next run.
    if: always() && needs.plan.result == 'success'
    permissions:
      contents: read
      packages: read # read the published tags and tool images
      id-token: write # Vault OIDC/JWT auth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Generate a GitHub token
      id: app-token
      # yamllint disable-line rule:line-length
      uses: camunda/infra-global-github-actions/generate-github-app-token-from-vault-secrets@405ecc95af077cd030bfe3249511e802fd9e4585 # generate-github-app-token-from-vault-secrets-1.3.1
      with:
        github-app-id-vault-key: GITHUB_APP_ID
        github-app-id-vault-path: secret/data/products/infra/ci/team-infrastructure
        github-app-private-key-vault-key: GITHUB_APP_PRIVATE_KEY
        github-app-private-key-vault-path: secret/data/products/infra/ci/team-infrastructure
        vault-auth-method: jwt
        vault-auth-jwt-role: ${{ secrets.VAULT_JWT_ROLE }}
        vault-auth-jwt-path: ${{ secrets.VAULT_JWT_PATH }}
        vault-auth-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE }}
        vault-url: ${{ secrets.VAULT_ADDR }}

    # The tip of main, which may have moved since the run started: the record commit goes on top of it.
    - name: Checkout main
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main
        token: ${{ steps.app-token.outputs.token }}
        persist-credentials: true # push the record commit as the Infra - Misc App

    # What was pushed is recorded with the tool definitions the builds used, the tip's once this passes: a line, revision or
    # install change merged to main since the run started supersedes it, and the run on the tip records instead.
    - name: Check the run is not superseded
      id: guard
      run: scripts/superseded.sh

    - name: Set up Node.js
      if: steps.guard.outputs.superseded == 'false'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .tool-versions
        cache: npm
        cache-dependency-path: scripts/package-lock.json

    - name: Install dependencies
      if: steps.guard.outputs.superseded == 'false'
      run: npm ci --prefix scripts

    # Each step appends its log to the one the run failure report reads.
    - name: Record the published tool versions
      if: steps.guard.outputs.superseded == 'false'
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -o pipefail
        mkdir -p "${OUT}"
        node scripts/record.mjs --image "${IMAGE}" --out "${OUT}" 2>&1 | tee -a "${OUT}/record.log"

    # Before the record commit: a run that fails here records the same versions next time.
    - name: Create the tool releases
      if: steps.guard.outputs.superseded == 'false'
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -o pipefail
        node scripts/publish.mjs --image "${IMAGE}" --repository "${REPOSITORY}" --out "${OUT}" 2>&1 | tee -a "${OUT}/record.log"

    - name: Push the record commit to main
      if: steps.guard.outputs.superseded == 'false'
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
      run: |
        set -o pipefail
        {
          if [[ ! -s "${OUT}/commit.txt" ]]; then
            echo "Nothing to record."
            exit 0
          fi
          # Transient GitHub errors are retried, 2, 4 then 8 s apart (ADR 0012).
          retry() {
            local delay
            for delay in 2 4 8; do
              "$@" && return
              echo "Failed, retried in ${delay} s: $*" >&2
              sleep "${delay}"
            done
            "$@"
          }
          user_id="$(retry gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add published
          git commit --file "${OUT}/commit.txt"
          retry git push origin HEAD:main
        } 2>&1 | tee -a "${OUT}/record.log"

    - name: Report the run failure
      if: failure() && steps.guard.outputs.superseded == 'false'
      run: node scripts/run-failure.mjs reconcile record --log "${OUT}/record.log" --out "${OUT}/reports/reconcile-record.json"

    - name: Upload the run failure
      if: failure() && steps.guard.outputs.superseded == 'false'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: report-record
        path: ${{ env.OUT }}/reports/reconcile-record.json
        if-no-files-found: error
        overwrite: true # a manual rerun of the job replaces it
        retention-days: 7

  failure-issues:
    name: Failure issues
    needs:
    - plan
    - build
    - record
    # Also after failed jobs, whose run failures it tracks; never on a cancelled run, nor on another branch, which plans nothing.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: read # read the published tags
      issues: write # open, update and close the failure issues
      id-token: write # Vault OIDC/JWT auth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # A superseded run's failures were met with tool definitions main no longer has: the run on the tip tracks its own.
    - name: Check the run is not superseded
      id: guard
      run: scripts/superseded.sh

    - name: Set up Node.js
      if: steps.guard.outputs.superseded == 'false'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .tool-versions
        cache: npm
        cache-dependency-path: scripts/package-lock.json

    - name: Install dependencies
      if: steps.guard.outputs.superseded == 'false'
      run: npm ci --prefix scripts

    # None when every build passed.
    - name: Download the tool failures
      if: steps.guard.outputs.superseded == 'false'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: failure-*
        merge-multiple: true
        path: ${{ env.OUT }}/failures

    # None when no step failed.
    - name: Download the run failures
      if: steps.guard.outputs.superseded == 'false'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: report-*
        merge-multiple: true
        path: ${{ env.OUT }}/reports

    # Once the run's builds are recorded, against the run's plan: writes the tool failure reports, a push report for each build
    # job that failed without one (a timeout), and the failure issue keys it checked, then fails when a version the run built is
    # neither published nor failed.
    - name: Check that every version built is published or failed (R17)
      id: check
      if: steps.guard.outputs.superseded == 'false' && needs.plan.result == 'success'
      env:
        GITHUB_TOKEN: ${{ github.token }}
        BUILDS: ${{ needs.plan.outputs.builds }}
      run: |
        set -o pipefail
        mkdir -p "${OUT}"
        jq . <<<"${BUILDS}" >"${OUT}/builds.json"
        node scripts/plan.mjs --image "${IMAGE}" --check --failures "${OUT}/failures" --out "${OUT}" 2>&1 | tee "${OUT}/completeness.log"

    - name: Report the completeness failure
      if: failure() && steps.check.outcome == 'failure'
      run: node scripts/run-failure.mjs reconcile completeness --log "${OUT}/completeness.log" --out "${OUT}/reports/reconcile-completeness.json"

    - name: Import Secrets
      id: secrets
      if: ${{ !cancelled() && steps.guard.outputs.superseded == 'false' }}
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
      with:
        url: ${{ secrets.VAULT_ADDR }}
        method: jwt
        role: ${{ secrets.VAULT_JWT_ROLE }}
        path: ${{ secrets.VAULT_JWT_PATH }}
        jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
        exportEnv: false # we rely on step outputs, no need for environment variables
        secrets: |
          secret/data/products/infra/ci/infra-core SLACK_WEBHOOK_INFRA_ALERTS;

    # A failed or cancelled (timed out) plan or record job without its report gets one without a log; build jobs get theirs from
    # the check. The open failure issue of a step that ran and passed closes, its report from an earlier attempt of the run, left
    # before a manual rerun of the job passed, dropped; so do those of the tool failure keys the check found resolved.
    - name: Open, update and close the failure issues
      if: ${{ !cancelled() && steps.guard.outputs.superseded == 'false' }}
      env:
        GH_TOKEN: ${{ github.token }}
        SLACK_WEBHOOK_INFRA_ALERTS: ${{ steps.secrets.outputs.SLACK_WEBHOOK_INFRA_ALERTS }}
        REPOSITORY: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        PLAN: ${{ needs.plan.result }}
        PUSH: ${{ needs.build.result }}
        RECORD: ${{ needs.record.result }}
        COMPLETENESS: ${{ steps.check.outcome }}
      run: |
        resolve=()
        for step in plan push record completeness; do
          var="${step^^}"
          result="${!var}"
          if [[ "${result}" == success || ( "${step}" == push && "${result}" == skipped && "${PLAN}" == success ) ]]; then
            resolve+=(--resolve "reconcile/${step}")
            rm -f "${OUT}/reports/reconcile-${step}".json "${OUT}/reports/reconcile-${step}"-*.json
          elif [[ "${step}" =~ ^(plan|record)$ && "${result}" =~ ^(failure|cancelled)$ && ! -f "${OUT}/reports/reconcile-${step}.json" ]]; then
            node scripts/run-failure.mjs reconcile "${step}" --out "${OUT}/reports/reconcile-${step}.json"
          fi
        done
        if [[ -f "${OUT}/resolve.txt" ]]; then
          while read -r scope; do resolve+=(--resolve "${scope}"); done <"${OUT}/resolve.txt"
        fi
        node scripts/failure-issues.mjs --repository "${REPOSITORY}" --run-url "${RUN_URL}" --failures "${OUT}/reports" "${resolve[@]}"

  check:
    name: Check Reconcile
    if: always()
    permissions: {}
    needs:
    - plan
    - build
    - record
    - failure-issues
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Check results
      env:
        ERROR: >-
          ${{
            contains(needs.*.result, 'failure') ||
            contains(needs.*.result, 'cancelled')
          }}
      run: |
        if [ "$ERROR" == "true" ]; then
          echo "Some reconciler jobs have failed or been cancelled: their run failures are in failure issues (run-failure label)."
          exit 1
        fi
        echo "All reconciler jobs passed or were skipped."

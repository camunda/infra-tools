---
name: ECR login prototype

# Throwaway (#16): checks that a job on an EKS runner logs in to the infra-tools ECR mirror with plain curl, through the
# runner's IRSA role (STS AssumeRoleWithWebIdentity, then a SigV4-signed GetAuthorizationToken), before the action does
# it. The pull request is closed without merging.

on:
  pull_request:

permissions: {}

jobs:
  ecr-login:
    name: ECR login (${{ matrix.runner }})
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [aws-core-2-default, aws-arm-core-2-default]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      REGISTRY: 463214588456.dkr.ecr.eu-central-1.amazonaws.com
    steps:
    - name: Tools and IRSA environment
      run: |
        curl --version | head -1
        jq --version
        uname -m
        echo "AWS_ROLE_ARN=${AWS_ROLE_ARN:-<unset>}"
        echo "AWS_WEB_IDENTITY_TOKEN_FILE=${AWS_WEB_IDENTITY_TOKEN_FILE:-<unset>}"
        test -r "${AWS_WEB_IDENTITY_TOKEN_FILE}"

    - name: Log in to ECR and read the infra-tools repository
      run: |
        set -euo pipefail
        region="$(cut -d. -f4 <<<"${REGISTRY}")"
        echo "region: ${region}"

        # STS takes the web identity token unsigned; POST keeps it out of the URL.
        credentials="$(curl -fsS --retry 3 -m 30 -H "Accept: application/json" "https://sts.${region}.amazonaws.com/" \
          --data-urlencode "Action=AssumeRoleWithWebIdentity" --data-urlencode "Version=2011-06-15" \
          --data-urlencode "RoleArn=${AWS_ROLE_ARN}" --data-urlencode "RoleSessionName=infra-tools" \
          --data-urlencode "WebIdentityToken@${AWS_WEB_IDENTITY_TOKEN_FILE}" \
          | jq -er '.AssumeRoleWithWebIdentityResponse.AssumeRoleWithWebIdentityResult.Credentials')"
        key_id="$(jq -er .AccessKeyId <<<"${credentials}")"
        secret="$(jq -er .SecretAccessKey <<<"${credentials}")"
        session="$(jq -er .SessionToken <<<"${credentials}")"
        echo "::add-mask::${secret}"
        echo "::add-mask::${session}"
        echo "STS: ok"

        authorization="$(curl -fsS --retry 3 -m 30 --aws-sigv4 "aws:amz:${region}:ecr" --user "${key_id}:${secret}" \
          -H "x-amz-security-token: ${session}" \
          -H "X-Amz-Target: AmazonEC2ContainerRegistry_V20150921.GetAuthorizationToken" \
          -H "Content-Type: application/x-amz-json-1.1" -d '{}' "https://api.ecr.${region}.amazonaws.com/" \
          | jq -er '.authorizationData[0].authorizationToken')"
        echo "::add-mask::${authorization}"
        echo "GetAuthorizationToken: ok"

        # The mirror is empty until a release fills it, and the read policy has no ecr:ListImages (tags/list): a missing
        # manifest answers 404 where the policy lets the runner read (BatchGetImage), 403 elsewhere.
        for repository in camunda/infra-tools dockerhub/library/docker; do
          status="$(curl -sS -o /dev/null -w '%{http_code}' -m 30 -I -H "Authorization: Basic ${authorization}" \
            -H "Accept: application/vnd.oci.image.index.v1+json" "https://${REGISTRY}/v2/${repository}/manifests/0.0.0-tools")"
          echo "manifest ${repository}:0.0.0-tools: HTTP ${status}"
        done

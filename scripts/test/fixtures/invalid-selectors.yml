---
# A consumer workflow with a selector that matches no version and a plain tool in the wrong input, for the validate mode
# test of ci.yml.
name: Invalid selectors

on: push

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Install tools
      uses: camunda/infra-tools@0000000000000000000000000000000000000000 # 1.0.0
      with:
        tools: maven@99
        tool-cache: maven@3

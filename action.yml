---
name: infra-tools
description: Installs the selected tools into the runner tool cache from the infra-tools index, and puts plain tools on PATH.

inputs:
  tools:
    description: >-
      Plain tools, one selector per line (`<tool>[@<version prefix>]`, e.g. `maven@3`), resolved to the highest matching version; present tools are not downloaded.
    default: ''
  tool-cache:
    description: >-
      Tool-cache tools, one selector per line (e.g. `java@21`, `node@26`), only placed in the tool cache: keep their setup-* step, given the version from `versions`.
    default: ''
  mode:
    description: >-
      `extract` installs the selected tools; `validate` checks the selectors of the repository's workflows and local actions against the index, installing nothing (needs yq).
    default: extract
  token:
    description: Token allowed to pull from the index registry.
    default: ${{ github.token }}
  index:
    description: >-
      Index to install from, `<registry>/<repository>:<tag>` (e.g. `ghcr.io/camunda/infra-tools:tracer-tools`). Required until the first release, which becomes the default.
    default: ''
  summary:
    description: '`true` adds a table of the selected tools (version, result, tool cache path) to the job summary.'
    default: 'false'

outputs:
  versions:
    description: >-
      Resolved version per selected tool, as JSON (`{"java":"21.0.13+9.0.LTS","maven":"3.9.16"}`) in the form setup-* actions expect; `{}` when nothing is installed.
    value: ${{ steps.setup.outputs.versions }}

runs:
  using: composite
  steps:
  - id: setup
    name: Install tools
    shell: bash
    env:
      TOOLS: ${{ inputs.tools }}
      CACHE_TOOLS: ${{ inputs.tool-cache }}
      MODE: ${{ inputs.mode }}
      TOKEN: ${{ inputs.token }}
      INDEX: ${{ inputs.index }}
      SUMMARY: ${{ inputs.summary }}
    run: '"${GITHUB_ACTION_PATH}/scripts/action/setup.sh"'
